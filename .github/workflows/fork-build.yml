name: Fork build

# Fork-only: builds the Release app on every move of main, unsigned for distribution ("Sign to Run
# Locally"), so a machine can install this fork's main. The machine re-signs it with its own stable
# identity before installing. The artifact is named after the commit it was built from.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-build-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Select latest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - name: Build Release
        run: |
          xcodebuild -project Adrafinil.xcodeproj -scheme Adrafinil -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath build \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            OTHER_CODE_SIGN_FLAGS=--timestamp=none build
      - name: Zip
        run: ditto -c -k --keepParent build/Build/Products/Release/Adrafinil.app Adrafinil.zip
      - uses: actions/upload-artifact@v4
        with:
          name: adrafinil-${{ github.sha }}
          path: Adrafinil.zip
          retention-days: 30
